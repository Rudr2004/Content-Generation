  <!-- Script to load page title immediately on hard refresh -->
  <script>
    (function() {
      // Fetch site settings and update title immediately (before React loads)
      fetch('/api/site-settings')
        .then(res => res.json())
        .then(data => {
          if (data && data.pageTitle) {
            document.title = data.pageTitle;
            const titleEl = document.querySelector('title');
            if (titleEl) titleEl.textContent = data.pageTitle;
            const metaTitle = document.querySelector('meta[name="title"]');
            if (metaTitle) metaTitle.setAttribute('content', data.pageTitle);
          } else if (data && data.siteName) {
            document.title = data.siteName;
            const titleEl = document.querySelector('title');
            if (titleEl) titleEl.textContent = data.siteName;
            const metaTitle = document.querySelector('meta[name="title"]');
            if (metaTitle) metaTitle.setAttribute('content', data.siteName);
          }
        })
        .catch(err => {
          console.log('Could not load site settings for title:', err);
          // Keep default title if fetch fails
        });
    })();
  </script>
